    <script>
let romanticAudio, romanticTimer, musicStarted=false;
const musicButton=document.getElementById("musicToggle");

function startRomanticMusic(){
  if(musicStarted) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  romanticAudio=new AC();
  const master=romanticAudio.createGain();
  master.gain.value=.10;
  master.connect(romanticAudio.destination);

  // Melodía romántica original, suave y sin archivos externos.
  const melody=[261.63,329.63,392,523.25,493.88,392,329.63,293.66,
                261.63,349.23,440,523.25,493.88,440,392,329.63];
  let step=0;
  function note(){
    const now=romanticAudio.currentTime;
    const osc=romanticAudio.createOscillator();
    const gain=romanticAudio.createGain();
    osc.type="sine";
    osc.frequency.value=melody[step%melody.length];
    gain.gain.setValueAtTime(0,now);
    gain.gain.linearRampToValueAtTime(.34,now+.08);
    gain.gain.exponentialRampToValueAtTime(.001,now+1.35);
    osc.connect(gain); gain.connect(master);
    osc.start(now); osc.stop(now+1.4);
    if(step%4===0){
      const bass=romanticAudio.createOscillator(), bg=romanticAudio.createGain();
      bass.type="sine"; bass.frequency.value=melody[step%melody.length]/2;
      bg.gain.setValueAtTime(.13,now); bg.gain.exponentialRampToValueAtTime(.001,now+2.6);
      bass.connect(bg); bg.connect(master); bass.start(now); bass.stop(now+2.7);
    }
    step++;
  }
  note();
  romanticTimer=setInterval(note,700);
  musicStarted=true;
  musicButton.textContent="⏸";
}
function pauseRomanticMusic(){
  if(romanticAudio && romanticAudio.state==="running"){
    romanticAudio.suspend(); musicButton.textContent="🎵";
  }else if(romanticAudio){
    romanticAudio.resume(); musicButton.textContent="⏸";
  }else startRomanticMusic();
}
musicButton.addEventListener("click",e=>{e.stopPropagation();pauseRomanticMusic();});
document.addEventListener("click",()=>startRomanticMusic(),{once:true});
window.addEventListener("load",()=>startRomanticMusic());
</script>
